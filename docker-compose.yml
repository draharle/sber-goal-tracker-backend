# docker compose up --build — PostgreSQL + сервис. Миграции, демо-данные и первый прогон
# выполняются при старте сервиса (Liquibase + StartupRunInitializer).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-goal_tracker}
      POSTGRES_USER: ${DB_USERNAME:-goal_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goal_tracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-goal_tracker}
      DB_USERNAME: ${DB_USERNAME:-goal_tracker}
      DB_PASSWORD: ${DB_PASSWORD:-goal_tracker}
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-demo}
      KKD_TODAY: ${KKD_TODAY:-2026-10-26}
      KKD_RUN_ON_STARTUP: ${KKD_RUN_ON_STARTUP:-true}
      KKD_ZONE: ${KKD_ZONE:-Europe/Moscow}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  db-data:
